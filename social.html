    <style>
        .social-container {
            width: 100%;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .social-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .iconItem span {
            font-size: 14px;
        }
        .social-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
        }
        .social-card {
            background: var(--item_bg_color);
            backdrop-filter: blur(var(--card_filter));
            border-radius: 15px;
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
        }
        .social-card:hover {
            transform: translateY(-5px);
            background: var(--item_hover_color);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .social-icon {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: var(--left_tag_item);
            flex-shrink: 0;
        }
        .social-icon svg {
            width: 30px;
            height: 30px;
            fill: var(--fill);
        }
        .social-info h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }
        .social-info p {
            margin: 5px 0 0;
            font-size: 13px;
            color: var(--item_left_text_color);
        }
        @media (max-width: 600px) {
            .social-grid {
                grid-template-columns: 1fr;
            }
            .welcome {
                font-size: 40px;
            }
        }
    </style>
