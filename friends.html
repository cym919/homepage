<!DOCTYPE html>
<html class="cym919.net">

<head class="cym919.net">
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="referrer" content="no-referrer-when-downgrade">
	<title>朋友圈 | cym919</title>
	<link rel="icon" href="./static/img/favicon.ico">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<link rel="stylesheet" href="./static/css/style.css">
	<link rel="stylesheet" href="./static/css/root.css">
    <style>
        .friends-container {
            width: 100%;
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .friends-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            margin-top: 30px;
        }
        .friend-card {
            background: var(--item_bg_color);
            backdrop-filter: blur(var(--card_filter));
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }
        .friend-card:hover {
            transform: translateY(-10px);
            background: var(--item_hover_color);
            border-color: var(--purple_text_color);
        }
        .friend-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 15px;
            object-fit: cover;
            border: 3px solid var(--purple_text_color);
        }
        .friend-name {
            font-size: 18px;
            font-weight: 600;
            color: var(--main_text_color);
        }

        /* 弹窗样式增强 */
        .modal-content {
            padding: 20px;
            text-align: center;
        }
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
            text-align: left;
        }
        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 15px;
            background: rgb(0 127 255 / 13%);
            border-radius: 10px;
            text-decoration: none;
            color: inherit;
            transition: background 0.2s;
        }
        .contact-item:hover {
            background: var(--item_hover_color);
        }
        .contact-item svg {
            width: 20px;
            height: 20px;
            fill: var(--fill);
        }
        .contact-label {
            font-size: 12px;
            color: var(--item_left_text_color);
            display: block;
        }
        .contact-value {
            font-size: 14px;
            font-weight: 500;
        }

        /* 覆盖原有的弹窗限制 */
        .tc-main {
            max-width: 350px;
            height: auto;
            padding-bottom: 20px;
            background-color: var(--item_bg_color);
        }
        
        .header-nav {
            width: 100%;
            padding: 20px 20px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>

<body>
	<div class="cym919-filter"></div>
    
    <header class="header-nav">
        <div class="iconContainer" style="margin-top: 0; width: auto;">
            <a href="index.html" class="iconItem" style="width: auto; padding: 0 15px; margin-left: 0;">
                <svg viewBox="0 0 1024 1024" style="margin-right: 8px;">
                    <path d="M669.6 849.6c8.8 8.8 23.2 8.8 32 0s8.8-23.2 0-32L385.6 512l316-305.6c8.8-8.8 8.8-23.2 0-32s-23.2-8.8-32 0L337.6 496c-8.8 8.8-8.8 23.2 0 32l332 321.6z"></path>
                </svg>
                <span style="font-size: 14px;">返回主页</span>
            </a>
        </div>

        <div style="display: flex; align-items: center;">
            <img id="tanChiShe" src="./static/svg/snake-Light.svg" style="display: none;">
            <a class="switch" href="javascript:void(0)">
                <div class="onoffswitch">
                    <input type="checkbox" name="onoffswitch" class="onoffswitch-checkbox" id="myonoffswitch" checked>
                    <label class="onoffswitch-label" for="myonoffswitch">
                        <span class="onoffswitch-inner"></span>
                        <span class="onoffswitch-switch"></span>
                    </label>
                </div>
            </a>
        </div>
    </header>

	<div class="friends-container">
		<div class="social-header" style="text-align: center;">
			<h1 class="welcome">My <span class="gradientText">Friends</span></h1>
			<p class="description">户籍展示</p>
		</div>

		<div class="friends-grid" id="friendsGrid">
            <!-- 数据将通过 JSON 动态加载 -->
		</div>
	</div>

    <br/>

	<footer>
		cym919 © 2026 |
		<a href="https://icp.gov.moe/?keyword=20260919" target="_blank">
			萌ICP备20260919号</a>
		<a href="https://gitcode.com/cym919/homepage" target="_blank">
			项目仓库</a>
	</footer>

    <!-- 弹窗结构 -->
    <div class="tc">
		<div class="tc-main" id="contactModal">
            <div class="modal-content">
                <img id="modalAvatar" src="" class="friend-avatar" style="width: 80px; height: 80px; margin-top: 20px;">
                <h3 id="modalName" class="friend-name" style="margin-bottom: 20px;"></h3>
                <div class="contact-list" id="modalContacts">
                    <!-- 联系方式动态生成 -->
                </div>
            </div>
		</div>
	</div>

    <script src="./static/js/script.js"></script>
    <script>
        // 从 JSON 加载数据
        fetch('https://cym919.top/api/home/friends')
            .then(response => response.json())
            .then(data => {
                const grid = document.getElementById('friendsGrid');
                data.forEach(friend => {
                    const card = document.createElement('div');
                    card.className = 'friend-card';
                    card.onclick = () => showContact(friend.name, friend.avatar, friend.contacts);
                    card.innerHTML = `
                        <img src="${friend.avatar}" class="friend-avatar" alt="${friend.name}">
                        <span class="friend-name">${friend.name}</span>
                    `;
                    grid.appendChild(card);
                });
            })
            .catch(error => console.error('Error loading friends data:', error));

        function showContact(name, avatar, contacts) {
            document.getElementById('modalAvatar').src = avatar;
            document.getElementById('modalName').innerText = name;
            
            const list = document.getElementById('modalContacts');
            list.innerHTML = '';

            };

            const labels = {
                phone: '电话',
                mail: '邮箱',
                wechat: '微信',
                qq: 'QQ',
                douyin: '抖音',
                bilibili: 'B站'
            };

            for (let key in contacts) {
                if (contacts[key] && contacts[key].value) {
                    const contactData = contacts[key];
                    const isLink = contactData.link && contactData.link !== "";
                    
                    const item = document.createElement(isLink ? 'a' : 'div');
                    item.className = 'contact-item';
                    if (isLink) {
                        item.href = contactData.link;
                        item.target = "_blank";
                    }

                    // 增加：点击 QQ/微信/抖音 时弹出 ID 提醒
                    if (['wechat', 'qq', 'douyin'].includes(key) && contactData.id) {
                        item.addEventListener('click', (e) => {
                            alert(`${labels[key]}号: ${contactData.id}`);
                        });
                    }
                    
                    item.innerHTML = `
                        ${icons[key]}
                        <div>
                            <span class="contact-label">${labels[key]}</span>
                            <span class="contact-value">${contactData.value}</span>
                        </div>
                    `;
                    list.appendChild(item);
                }
            }
            
            // 调用原有的 pop 函数显示弹窗（不传 URL 避免覆盖 modal 内容）
            pop();
        }
    </script>
</body>
</html>
